name: Nostr Gaza Bot Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'

# هذا الجزء يضمن إيقاف وإلغاء أي تشغيل قديم فوراً بمجرد رفع تعديل جديد أو تشغيل جديد
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests nostr-sdk

      - name: Run Bot Script
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py
