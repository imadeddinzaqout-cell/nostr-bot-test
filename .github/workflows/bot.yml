name: Nostr Gaza Bot Runner

on:
  workflow_dispatch: # تتيح لك تشغيل البوت يدوياً
  schedule:
    - cron: '0 */6 * * *' # إعادة تشغيل احتياطية كل 6 ساعات

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # يعمل لمدة 5 ساعات و50 دقيقة

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nostr-sdk requests

      - name: Execute Nostr Bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py

      - name: Auto Re-trigger Workflow (Seamless 24/7)
        if: always() # يعمل دائماً عند انتهاء خطوة البوت
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Nostr Gaza Bot Runner" --ref main
