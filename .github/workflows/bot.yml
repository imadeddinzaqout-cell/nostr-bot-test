name: Continuous Test Run

on:
  workflow_dispatch: # تشغيل يدوياً عند الضغط على زر Run workflow

jobs:
  run-continuous:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # الحد الأقصى للجلسة الواحدة (6 ساعات)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install nostr-sdk requests

      - name: Run continuous bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py
