name: Nostr Gaza Bot Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # تشغيل تلقائي كل 5 ساعات (على مدار الساعة 24/7)
    - cron: '0 */5 * * *'

concurrency:
  group: nostr-bot-continuous
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests "nostr-sdk==0.37.0"

      - name: Run Bot Script
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -u main.py
