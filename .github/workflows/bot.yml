name: Nostr Gaza Bot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests nostr-sdk

      - name: Run Bot Script
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py
