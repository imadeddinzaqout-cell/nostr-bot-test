name: Nostr Gaza Bot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # 👈 يعمل كل 30 دقيقة طوال اليوم (يفحص، يرد، ثم يستريح)

# 🛑 منع تداخل التشغيلات
concurrency:
  group: nostr-bot-group
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # حد أقصى 10 دقائق لتنفيذ الدورة

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nostr-sdk requests

      - name: Execute Nostr Bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py
