name: Nostr Gaza Bot Runner

concurrency:
  group: nostr-bot-single-instance
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # تشغيل كل 10 دقائق لتنفيذ 144 تشغيلة يومياً
    - cron: '*/10 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nostr-sdk requests

      - name: Execute Nostr Bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py
