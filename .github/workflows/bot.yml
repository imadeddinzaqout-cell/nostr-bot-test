name: Nostr Gaza Bot Runner

# 🛑 1. منع تشغيل أكثر من نسخة واحدة في نفس الوقت تماماً
concurrency:
  group: nostr-bot-single-instance
  cancel-in-progress: false

on:
  workflow_dispatch: # للتشغيل اليدوي وقتما تشاء
  schedule:
    - cron: '*/30 * * * *' # 2. تشغيل متزن كل 30 دقيقة (تبدو حركة بشرية طبيعية)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nostr-sdk requests

      - name: Execute Nostr Bot
        env:
          NOSTR_NSEC: ${{ secrets.NOSTR_NSEC }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py
